name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BlogApp.slnx

      - name: Build
        run: dotnet build BlogApp.slnx --no-restore --configuration Release

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations has-pending-model-changes --project BlogApp.Data --startup-project BlogApp.MVC --no-build --configuration Release
