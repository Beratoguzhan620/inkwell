# nginx for the one-container demo: the site at / and the admin panel at /admin, each on a local port, with paths an
# unprivileged user can write to.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Cover images are up to 5 MB.
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    server {
        listen 8080;

        location = /admin {
            return 302 /admin/;
        }

        # The admin panel strips /admin itself (PathBase), so links it makes keep the prefix.
        location /admin/ {
            proxy_pass http://127.0.0.1:8082;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
